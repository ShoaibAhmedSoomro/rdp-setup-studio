name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 # GitHub-hosted job hard limit is 6h

    steps:
      - name: Configure RDP
        run: |
          # NLA stays ON: credentials go from your client as Unicode, so keyboard layout can't break them
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP user
        run: |
          # ponytail: alphanumeric only, typeable on any keyboard; "Aa1" guarantees complexity rules
          $chars = [char[]](48..57 + 65..90 + 97..122)
          $password = (-join (1..16 | ForEach-Object { $chars | Get-Random })) + "Aa1"
          New-LocalUser -Name "RDP" -Password (ConvertTo-SecureString $password -AsPlainText -Force) -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait

      - name: Connect Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-rdp-$env:GITHUB_RUN_ID"
          $ip = $null
          for ($i = 0; -not $ip -and $i -lt 12; $i++) { Start-Sleep 5; $ip = & $ts ip -4 }
          if (-not $ip) { Write-Error "Tailscale IP not assigned"; exit 1 }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP port
        run: |
          if (-not (Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389).TcpTestSucceeded) { Write-Error "Port 3389 unreachable"; exit 1 }

      - name: Maintain connection
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: .\RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=================="
          while ($true) { Start-Sleep 300; Write-Host "[$(Get-Date)] RDP active" }
